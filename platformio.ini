; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[base]
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -std=gnu++2b
    -std=gnu++23
build_flags =
    -std=gnu++20
    -foptimize-sibling-calls
    -D CORO_DISABLE_EXCEPTION
framework = arduino
monitor_speed = 115200

[env:esp32-s3-arduino]
extends = base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = 4d_systems_esp32s3_gen4_r8n16
upload_speed = 921600
;board_build.partitions = huge_app.csv ;S3 no need
build_flags =
    ${base.build_flags}
    -D BLINK_LED=GPIO_NUM_43

[env:esp32-c3-baremetal]
extends = base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework =
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 40000000L
extra_scripts = pre:scripts/baremetal_c3.py
build_flags =
    ${base.build_flags}
    -D DEMO_BAREMETAL_C3
    -D NDEBUG

[env:esp32-arduino]
extends = base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = heltec_wifi_kit_32
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    ${base.build_flags}
    -D BLINK_LED=GPIO_NUM_25

[env:esp8266-arduino]
extends = base
platform = espressif8266@4.2.1
framework = arduino
board = heltec_wifi_kit_8
build_flags =
    ${base.build_flags}
    -D BLINK_LED=0
    -fcoroutines
